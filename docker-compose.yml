# Local development stack.
#
# Every service declares a healthcheck and the backend waits on
# `service_healthy`, not `service_started` — a container that has been created
# is not a database that accepts connections, and depending on the former is the
# single most common cause of "it works on the second `up`".
#
# Ports are bound to 127.0.0.1 so a laptop on a café network is not serving an
# unauthenticated Postgres to the room.

name: knowledgeos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgeos}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U matters: without it pg_isready checks the OS user, not the app user,
      # and reports healthy while the application's role does not yet exist.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledgeos} -d ${POSTGRES_DB:-knowledgeos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Refresh-token revocation lives here, so persistence is on: losing the
    # denylist on restart would silently un-revoke every revoked token.
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Pinned to match the qdrant-client major/minor in pyproject. The client
    # refuses a mismatch of more than one minor version, and an "incompatible
    # version" warning today is a broken API call after the next client bump.
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No QDRANT__SERVICE__API_KEY here, deliberately.
    #
    # Qdrant treats the key set to an EMPTY STRING as "auth enabled with an empty
    # key" and then 401s every request — which reads as a broken deployment
    # rather than a misconfiguration. Compose has no way to conditionally omit a
    # mapping-form variable (`${X:-}` still passes X=""), so the variable is
    # simply absent here and Qdrant runs unauthenticated.
    #
    # That is correct for local development: the port is bound to 127.0.0.1 only.
    # Production enables auth in docker-compose.prod.yml, where the key is real
    # and comes from the secret manager (§28.1).
    healthcheck:
      # The Qdrant image ships no curl or wget, so probe from inside with bash's
      # /dev/tcp rather than adding a package purely to answer "are you up".
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applied as a one-shot job BEFORE the application starts, never at app
  # startup: N replicas booting at once would race Alembic (§19).
  migrate:
    build: {context: ./backend, dockerfile: Dockerfile}
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: &backend_env
        ENVIRONMENT: ${ENVIRONMENT:-local}
        SECRET_KEY: ${SECRET_KEY}
        DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledgeos}:${POSTGRES_PASSWORD:-knowledgeos}@postgres:5432/${POSTGRES_DB:-knowledgeos}
        REDIS_URL: redis://redis:6379/0
        QDRANT_URL: http://qdrant:6333
        QDRANT_API_KEY: ${QDRANT_API_KEY:-}
        LLM_PROVIDER: ${LLM_PROVIDER:-scripted}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5}
        UTILITY_MODEL: ${UTILITY_MODEL:-claude-haiku-4-5}
        EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
        EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
        RELEVANCE_FLOOR: ${RELEVANCE_FLOOR:-0.58}
        STORAGE_LOCAL_PATH: /data/storage
        CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
        LOG_JSON: ${LOG_JSON:-true}
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment: *backend_env
    volumes:
      - storage_data:/data/storage
      # ONNX weights are ~90 MB and identical across restarts; caching them
      # turns every cold start after the first into a fast one.
      - model_cache:/home/app/.cache
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Same image as the backend, different command — two images that must stay in
  # lockstep will not (§20). Scale independently: `docker compose up -d
  # --scale worker=4` for a bulk import, without touching chat capacity.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment: *backend_env
    volumes:
      - storage_data:/data/storage
      - model_cache:/home/app/.cache
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    environment:
      # The browser only ever talks to this origin; Next proxies /api onward,
      # which is what makes the httpOnly refresh cookie same-site (§19).
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  storage_data:
  model_cache:
