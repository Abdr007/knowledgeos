# Alembic configuration.
#
# The database URL is NOT set here. It is read from Settings in env.py, so there
# is exactly one place in the system that knows how to reach the database (§21)
# and no chance of migrations running against a different target than the app.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, ordered filenames: migrations sort chronologically in a directory
# listing, which is how you read a schema's history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
version_path_separator = os

[post_write_hooks]
# `exec` with an explicit venv path, not `console_scripts`: alembic resolves
# console_scripts against its own installed distributions, which does not find
# ruff when alembic is invoked as .venv/bin/alembic without .venv/bin on PATH.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
