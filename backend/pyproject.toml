[project]
name = "knowledgeos-backend"
version = "0.1.0"
description = "KnowledgeOS AI — enterprise knowledge platform backend"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # config and validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # data
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "qdrant-client>=1.12",
    # auth
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    # llm
    # document parsing
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "anthropic>=0.120.1",
    # Shipped because the blueprint specifies OpenAI (D1); LLM_PROVIDER selects.
    "openai>=1.60",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Warnings are errors. A suite that tolerates them accumulates warnings until
# nobody reads them, and the one that mattered is lost in the noise.
#
# Exemptions are narrow and justified individually, never a blanket "ignore".
filterwarnings = [
    "error",
    # Starlette's TestClient warns that httpx support is deprecated in favour of
    # httpx2. Swapping is not ours to make yet: the anthropic and openai SDKs
    # both pin httpx, so installing httpx2 would fracture the dependency tree to
    # silence a warning in test-only code. Revisit when those SDKs move.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # assert is how tests are written
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105", "S106",  # fixtures carry obvious fake secrets
    "S104",          # "0.0.0.0" is DATA here: an address the SSRF guard must reject
    "S110",          # best-effort Redis cleanup in a fixture; a failure must not fail the test
    "B017",          # asserting a tampered JWT raises *something* is the point
    "RUF007",        # zip() over successive chunks reads better than pairwise() here
]
# Migrations are generated; reformatting them creates diff noise and the long
# lines are Alembic's own output.
"alembic/versions/*" = ["E501"]
# S608 flags the f-string that assembles the vector search's WHERE clause. The
# clause fragments are a closed set of literals in the same function and every
# value is a bound parameter, so there is no injection surface — but the rule
# cannot see that. Scoped to this one file rather than silenced globally.
"app/providers/vector/pgvector_store.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
