[project]
name = "knowledgeos-backend"
version = "0.1.0"
description = "KnowledgeOS AI — enterprise knowledge platform backend"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # config and validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # data
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "qdrant-client>=1.12",
    # auth
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    # llm
    # document parsing
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "anthropic>=0.120.1",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Warnings are errors. A suite that tolerates them accumulates warnings until
# nobody reads them, and the one that mattered is lost in the noise.
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # assert is how tests are written
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test fixtures carry obvious fake secrets

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
