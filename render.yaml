# Render Blueprint — the deployed demo.
#
# Provisions the whole backend declaratively from this repository:
# API, Postgres (with pgvector) and a key-value store. One click from
# https://render.com/deploy?repo=https://github.com/Abdr007/knowledgeos
#
# ── how this differs from docker-compose.yml, and why ──────────────────────
#
# The local stack runs five containers, including Qdrant and a separate worker
# process. Render's free tier offers neither private services nor background
# workers, so this deployment makes two topology substitutions. Both are
# configuration, not architectural change — every one of them is a different
# implementation of an existing protocol or a different placement of the same
# loop:
#
#   VECTOR_BACKEND=pgvector   the VectorStore protocol's second implementation
#                             (TDD §29.1), so vectors live in Postgres instead
#                             of Qdrant. Verified to return identical cosine
#                             scores, so the 0.58 refusal floor is unchanged.
#
#   STORAGE_BACKEND=postgres  objects in a table rather than a shared volume,
#                             because a volume cannot be mounted by two services.
#
#   RUN_WORKER_INLINE=true    the ingestion loop runs in a thread inside the API
#                             process. Same queue, same claim/acknowledge
#                             protocol, same retries — one fewer process.
#
#   MIGRATE_ON_START=true     safe here and only here: the free plan runs a
#                             single instance, so there are no replicas to race
#                             (TDD §19). Anything larger runs KOS_ROLE=migrate
#                             as its own pre-deploy step.
#
# Scaling up means reversing these four values, not rewriting anything.

databases:
  - name: knowledgeos-db
    databaseName: knowledgeos
    user: knowledgeos
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: knowledgeos-kv
    plan: free
    # Reachable only from services in this Blueprint.
    ipAllowList: []
    # The refresh-token denylist lives here and is correctness-critical, so
    # evicting it would silently un-revoke revoked tokens (TDD §14). `noeviction`
    # makes a full instance fail loudly instead.
    maxmemoryPolicy: noeviction

  - type: web
    name: knowledgeos-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      # Generated once by Render and held in its secret store; never in the repo.
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: knowledgeos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: knowledgeos-kv
          property: connectionString

      # ── topology substitutions (see the header) ──────────────────────────
      - key: VECTOR_BACKEND
        value: pgvector
      - key: STORAGE_BACKEND
        value: postgres
      - key: RUN_WORKER_INLINE
        value: "true"
      - key: MIGRATE_ON_START
        value: "true"

      # ── models ───────────────────────────────────────────────────────────
      # Extractive and offline until a provider key is set. Switching to
      # generated prose is this one value plus ANTHROPIC_API_KEY.
      - key: LLM_PROVIDER
        value: scripted
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the dashboard, never committed
      - key: CHAT_MODEL
        value: claude-opus-5
      - key: UTILITY_MODEL
        value: claude-haiku-4-5

      # Embeddings run locally on CPU, so retrieval needs no vendor credential
      # and no document text leaves the deployment (D2).
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: "384"

      # ── retrieval ────────────────────────────────────────────────────────
      # Measured, not guessed: on-topic 0.63-0.76, off-corpus 0.49-0.52.
      - key: RELEVANCE_FLOOR
        value: "0.58"
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: CHUNK_SIZE_CHARS
        value: "1200"
      - key: CHUNK_OVERLAP_CHARS
        value: "150"

      # ── surface ──────────────────────────────────────────────────────────
      # The API is fronted by Vercel, which proxies same-origin, so this is the
      # public console origin.
      - key: CORS_ORIGINS
        value: https://knowledgeos-ai.vercel.app
      # The source is public, so the OpenAPI schema discloses nothing new —
      # and decoupled from ENVIRONMENT, so enabling it does not weaken cookie
      # security or drop HSTS.
      - key: DOCS_ENABLED
        value: "true"
      - key: LOG_JSON
        value: "true"

      # ── memory budget: 512 MB, and ONNX inference is the tenant ──────────
      #
      # The first attempt was OOM-killed mid-ingestion. The model alone is
      # ~200 MB resident; parsing a 1.5 MB PDF, holding ~100 chunk texts and
      # embedding 64 of them at once pushed it over. Three levers, in order of
      # effect:
      #
      # 1. Batch size. Peak allocation during inference scales with it, and the
      #    throughput cost is small because the model load dominates anyway.
      - key: EMBEDDING_BATCH_SIZE
        value: "4"
      # 2. Thread count. onnxruntime allocates a memory arena PER THREAD, and it
      #    sizes its pool from the host's visible core count — which is not what
      #    this container is actually allotted. One thread, one arena.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ORT_NUM_THREADS
        value: "1"
      # 3. Upload cap. A 50 MB document cannot be parsed inside this budget, so
      #    it is rejected at the door with a clear 413 rather than taking the
      #    instance down. The local stack keeps the full 50 MB.
      - key: MAX_UPLOAD_BYTES
        value: "8388608"   # 8 MB
      # Retrieval breadth also costs memory per query; 40 candidates is generous
      # for a demo corpus and 20 measurably changes nothing at this size.
      - key: RETRIEVAL_CANDIDATES
        value: "20"
